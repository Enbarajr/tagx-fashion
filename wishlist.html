<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Wishlist | TagX Fashion</title>
  <meta name="description" content="View your saved streetwear items on TagX Fashion wishlist.">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Top Announcement Bar -->
  <div class="announcement-bar">
    <span>🔥 FREE Delivery on Orders Over ₹499 | Direct WhatsApp Instant Order</span>
  </div>

  <!-- Header Navigation -->
  <header class="header-wrapper">
    <div class="container navbar">
      <button class="icon-btn" onclick="toggleMobileDrawer()" title="Menu">
        <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>

      <a href="index.html" class="nav-brand">
        <img src="assets/logo.png" alt="TagX Logo" class="brand-logo">
      </a>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="collections.html" class="nav-link">Collections</a>
        <a href="how-to-order.html" class="nav-link">How To Order</a>
        <a href="faq.html" class="nav-link">FAQ</a>
        <a href="support.html" class="nav-link">Support</a>
        <a href="contact.html" class="nav-link">Contact</a>
        <a href="whatsapp-groups.html" class="nav-link" style="color: var(--whatsapp-color);">💬 VIP Groups</a>
      </nav>

      <div class="nav-actions">
        <button class="icon-btn" onclick="toggleSearchModal()" title="Search Products">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </button>

        <a href="wishlist.html" class="icon-btn" title="Wishlist">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
          <span class="icon-badge wishlist-badge" style="display: none;">0</span>
        </a>

        <a href="cart.html" class="icon-btn" title="Cart">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
          <span class="icon-badge cart-badge" style="display: none;">0</span>
        </a>

        <button class="icon-btn theme-toggle-btn" onclick="toggleTheme()"></button>
      </div>
    </div>
  </header>

  <!-- Mobile Drawer -->
  <div id="mobile-drawer-overlay" class="mobile-drawer-overlay" onclick="toggleMobileDrawer()"></div>
  <aside id="mobile-drawer" class="mobile-drawer">
    <div class="drawer-header">
      <img src="assets/logo.png" alt="TagX Logo" style="height: 36px;">
      <button onclick="toggleMobileDrawer()" style="font-size: 1.5rem;">&times;</button>
    </div>
    <nav class="drawer-menu">
      <a href="index.html" class="drawer-link">Home</a>
      <a href="collections.html" class="drawer-link">Collections</a>
      <a href="wishlist.html" class="drawer-link active">Wishlist</a>
    </nav>
  </aside>

  <!-- Wishlist Main Content -->
  <main class="container section-padding">

    <h1 style="font-family: var(--font-heading); font-size: 2.2rem; font-weight: 900; margin-bottom: 2rem;">Saved Wishlist ❤️</h1>

    <div id="wishlist-grid" class="products-grid"></div>

  </main>

  <!-- Mobile Bottom Sticky Bar -->
  <nav class="mobile-bottom-nav">
    <a href="index.html" class="bottom-nav-item">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span>Home</span>
    </a>
    <a href="collections.html" class="bottom-nav-item">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
      <span>Shop</span>
    </a>
    <a href="wishlist.html" class="bottom-nav-item active">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
      <span>Wishlist</span>
    </a>
    <a href="cart.html" class="bottom-nav-item">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
      <span>Cart</span>
    </a>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>

  <script>
    function renderWishlistPage() {
      const container = document.getElementById('wishlist-grid');
      const listIds = getWishlist();
      const items = listIds.map(id => getProductById(id)).filter(p => p);

      if (items.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; background: var(--bg-card); border: 1px solid var(--border); padding: 3rem; border-radius: var(--radius-lg); text-align: center;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">❤️</div>
            <h3 style="font-family: var(--font-heading); font-size: 1.5rem; font-weight: 800; margin-bottom: 8px;">Your Wishlist is Empty</h3>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Save your favorite streetwear items here to view or buy later!</p>
            <a href="collections.html" class="btn btn-primary btn-lg">Explore Collections</a>
          </div>
        `;
        return;
      }

      renderProductsGrid(container, items);
    }

    document.addEventListener('DOMContentLoaded', renderWishlistPage);
  </script>
</body>
</html>
